name: Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to release, for example v0.3.1."
        required: true
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    name: Create GitHub Release
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ inputs.tag || github.ref }}

      - name: Check package version matches tag
        shell: bash
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail

          package_version="$(sed -n 's/^[[:space:]]*\.version = "\([^"]*\)",[[:space:]]*$/\1/p' build.zig.zon)"
          tag_version="${RELEASE_TAG#v}"

          if [ "$package_version" != "$tag_version" ]; then
            echo "build.zig.zon version ($package_version) does not match release tag ($RELEASE_TAG)"
            exit 1
          fi

      - name: Generate notes
        shell: bash
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          scripts/release-notes "$RELEASE_TAG" > release-notes.md
          cat release-notes.md

      - name: Add notes to job summary
        shell: bash
        run: |
          {
            echo "## Release Notes"
            echo
            cat release-notes.md
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          gh release create "$RELEASE_TAG" \
            --title "$RELEASE_TAG" \
            --notes-file release-notes.md \
            --verify-tag
