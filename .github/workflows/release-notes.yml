name: Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to release, for example v0.3.1."
        required: true
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    name: Create GitHub Release
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Check package version matches tag
        shell: bash
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail

          package_version="$(sed -n 's/^[[:space:]]*\.version = "\([^"]*\)",[[:space:]]*$/\1/p' build.zig.zon)"
          tag_version="${RELEASE_TAG#v}"

          if [ "$package_version" != "$tag_version" ]; then
            echo "build.zig.zon version ($package_version) does not match release tag ($RELEASE_TAG)"
            exit 1
          fi

      - name: Check the changelog covers the tag
        shell: bash
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail

          version="${RELEASE_TAG#v}"
          heading="$(grep -m1 "^## ${version//./\\.} " CHANGELOG.md || true)"
          if [ -z "$heading" ]; then
            echo "CHANGELOG.md has no section for $RELEASE_TAG"
            exit 1
          fi
          if [[ "$heading" == *Unreleased* ]]; then
            echo "CHANGELOG.md still marks $RELEASE_TAG as unreleased: $heading"
            exit 1
          fi

      - name: Write notes
        shell: bash
        env:
          CHANGELOG_URL: ${{ github.server_url }}/${{ github.repository }}/blob/${{ inputs.tag || github.ref_name }}/CHANGELOG.md
        run: |
          printf 'See [CHANGELOG.md](%s) for the changes in this release.\n' "$CHANGELOG_URL" > release-notes.md
          cat release-notes.md

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          gh release create "$RELEASE_TAG" \
            --title "$RELEASE_TAG" \
            --notes-file release-notes.md \
            --verify-tag
