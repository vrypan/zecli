name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  ZIG_VERSION: 0.16.0

jobs:
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]

    steps:
      - uses: actions/checkout@v4

      - uses: mlugg/setup-zig@v2
        with:
          version: ${{ env.ZIG_VERSION }}

      - name: Check formatting
        run: |
          zig fmt --check src/cli.zig src/completion.zig src/test.zig \
            src/completion_test.zig example/src/main.zig build.zig example/build.zig build.zig.zon

      - name: Check whitespace
        run: git diff --check

      - name: Run tests
        run: zig build test

      - name: Build the example
        run: zig build
        working-directory: example

      - name: Check generated help
        working-directory: example
        run: |
          ./zig-out/bin/zecli-example --help
          ./zig-out/bin/zecli-example greet --help

  shells:
    name: Shell completions
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: mlugg/setup-zig@v2
        with:
          version: ${{ env.ZIG_VERSION }}

      - name: Install shells
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y zsh fish

      - name: Build the example
        run: zig build
        working-directory: example

      - name: Behavioral shell tests
        run: scripts/test-completions example/zig-out/bin/zecli-example
